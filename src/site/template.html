(function(){

const tc = s => String(s||'').toLowerCase().replace(/(^|[\s(\-.&\/,])([a-z])/g, (m,p,c)=>p+c.toUpperCase()).replace(/\b([A-Z])'([a-z])/g, (m,a,b)=>a+"'"+b.toUpperCase()).replace(/\b(Uk|Plc|Llp|Llc|Gmbh|Sarl|Nhs|Ukas|Bv|Nv|Ag|Sa)\b/g, m=>CAPS[m]||m);
const SMALL = new Set(['a','an','and','as','at','by','for','from','in','of','on','or','the','to','with']);

const cname = s => tc(s).replace(/\s*,\s*/g, ', ').replace(/\s+/g,' ').trim();

const cap = s => s ? String(s).charAt(0).toUpperCase()+String(s).slice(1) : '';
const trim0 = s => s.replace(/\.0(?=[A-Z]$)/, '');
const money = (v, cur) => { if (!isNum(v)) return DASH; v = Number(v); const a = Math.abs(v), s = v < 0 ? '-' : ''; if (a >= 1e9) return s+cur+trim0((a/1e9).toFixed(1)+'B'); if (a >= 1e6) return s+cur+trim0((a/1e6).toFixed(1)+'M'); if (a >= 1e3) return s+cur+Math.round(a/1e3)+'K'; return s+cur+Math.round(a); };

const factText = s => String(s||'').replace(/GBP\s*(-?)([\d.]+)([MKB])/g, (m,neg,n,u)=>`${neg}£${trim0(n+u)}`).replace(/\bEUR\s*(-?)([\d.]+)([MKB])/g, (m,neg,n,u)=>`${neg}€${trim0(n+u)}`).replace(/\d{4}-\d{2}-\d{2}/g, m=>date(m)).replace(/\bn\/a\b/g, 'not stated');
const gbp = v => money(v, '£');
const eurM = v => isNum(v) ? money(Number(v)*1e6, '€') : DASH;

const pctN = v => isNum(v) ? (Number(v)*100).toFixed(1) : DASH;
const pts = v => isNum(v) ? Number(v).toFixed(1) : DASH;

const plural = (n, one, many) => `${num(n)} ${Number(n)===1 ? one : (many || one+'s')}`;

function filteredRows(){
  let rows = D.rankings.filter(r => r.ranked || state.comparables);
  rows = rows.filter(r => state.sectors.has(r.vertical));
  if (state.route !== 'all') rows = rows.filter(r => r.route === state.route);
  if (state.band === 'strategic') rows = rows.filter(r => /strategic fund band/.test(r.size_fit||''));
  if (state.band === 'flagship') rows = rows.filter(r => /^flagship band/.test(r.size_fit||''));
  if (state.band === 'either') rows = rows.filter(r => /band/.test(r.size_fit||''));
  if (state.q) rows = rows.filter(r => [r.name, r.post_town, r.sub_vertical, r.company_number, r.domain].join(' ').toLowerCase().includes(state.q));
  const key = state.sort, dir = state.asc ? 1 : -1;
  rows.sort((a,b) => {
    if (key === 'rank'){ const x = a.rank ?? 1e9, y = b.rank ?? 1e9; return (x - y) * (state.asc ? 1 : -1); }
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    if (typeof x === 'string') return x.localeCompare(y) * dir;
    return (x - y) * dir || ((b.fit_score??-1) - (a.fit_score??-1));
  });
  return rows;
}

function actionsHtml(n){

// ------------------------------------------------------------ investment brief
function briefParts(n){
  const c = D.companies[n], r = RANK[n];
  const sc = c.scores.filter(s=>s.score!=null);
  const strengths = sc.slice().sort((a,b)=>b.score-a.score || (W[b.dimension]||0)-(W[a.dimension]||0)).slice(0,3);
  const cautions = (c.why_now||[]).filter(x=>x.direction==='caution');
  const weak = sc.slice().sort((a,b)=>a.score-b.score || (W[b.dimension]||0)-(W[a.dimension]||0)).filter(s=>!strengths.includes(s));
  const watch = [];
  for (const x of cautions){ if (watch.length < 3) watch.push({head:whyLine(x.label), body:whyLine(sent(x.detail))}); }
  for (const s of weak){ if (watch.length < 3) watch.push({head:`${s.dimension_name} scored ${s.score} of 5`, body:sent(s.rationale)}); }
  const acc = (c.accounts||[]).slice().sort((a,b)=>String(b.period_end).localeCompare(String(a.period_end)));
  const latest = acc.find(a=>!a.comparative) || acc[0] || {};
  const prior = acc.find(a => a.period_end && latest.period_end && a.period_end < latest.period_end) || null;
  const plen = months(prior && prior.period_end, latest.period_end);
  const period = plen && plen !== 12 ? `${plen} months to ${date(r.latest_period_end)}` : `year to ${date(r.latest_period_end)}`;
  const ownerBit = r.route === 'sponsor' || r.route === 'sponsor_offshore' ? `owned by ${listed(r.sponsor_names && r.sponsor_names.length ? r.sponsor_names : (r.owner_names||[]).map(cname))}${r.hold_years!=null?` for ${pts(r.hold_years)} years`:''}` : r.route === 'founder_family' ? `controlled by ${plural(r.n_individuals||0,'individual')} on the PSC register${r.oldest_owner_age!=null?`, the oldest about ${num(r.oldest_owner_age)}`:''}` : r.route === 'employee_owned' ? 'held by an employee ownership trust' : (ROUTE[r.route]||'').toLowerCase();
  const thesis = `${cname(r.name)} is a ${r.sub_vertical||SECTOR[r.vertical].toLowerCase()} business in ${tc(r.post_town||'the UK')}, ${ownerBit}. Turnover was ${gbp(r.latest_turnover)}${isNum(r.turnover_growth)?` (${turnoverGrowth(r)})`:''} and ${r.ebitda_basis||'EBITDA'} ${gbp(r.ebitda_proxy)} in the ${period}, with ${num(r.latest_employees)} employees. Investment Quality ${pts(r.durability_score)} of 100 and Entry Fit ${pts(r.fit_score)} of 100 place it in the ${bandLabel(r.size_fit).toLowerCase()}${r.ranked?` at rank ${r.rank}`:' as a comparable'}.`;
  return {thesis, strengths, watch, cautions};
}
function briefHtml(n){
  const p = briefParts(n);
  return `<h4>Thesis</h4><p>${esc(p.thesis)}</p>
    <h4>Three Strengths</h4>${p.strengths.length ? `<ul>${p.strengths.map(s=>`<li><strong>${esc(s.dimension_name)} (${s.score} of 5):</strong> ${esc(sent(s.rationale))}</li>`).join('')}</ul>` : '<p class="small">No scored dimensions.</p>'}

function briefText(n){

function firstIndividual(c){
  const p = (c.psc||[]).filter(x=>x.is_active && x.kind==='individual-person-with-significant-control').sort((a,b)=>String(a.notified_on||'').localeCompare(String(b.notified_on||'')))[0];
  if (!p) return null;
  const parts = cname(p.name||'').replace(/^(Mr|Mrs|Ms|Miss|Dr|Sir|Dame|Lord|Lady|Prof|Professor)\.?\s+/i,'').split(/\s+/);
  return {full: parts.join(' '), first: parts[0]||''};
}
function outreachNote(r, c){

  const p = firstIndividual(c); if (p) return `Addressed to ${p.full}, the earliest active individual on the PSC register. Confirm the role on the company website.`;
  if (r.route === 'employee_owned') return 'Addressed to the trustees of the employee ownership trust.';

}
function outreachText(n){

${greeting}

[your name]
[your firm]`;

    return;

// ------------------------------------------------------------ methods: rendered QA, back-tests, coverage
const kvRows = rows => `<div class="kv">${rows.filter(r=>r[1]!=null && r[1]!=='' && !(typeof r[1]==='number' && isNaN(r[1]))).map(([k,v,sub])=>`<div class="k">${esc(k)}</div><div>${v}${sub?`<span class="sub">${esc(sub)}</span>`:''}</div>`).join('')}</div>`;
function qaCard(q){
  return `<div class="card"><h4>Quality Checks</h4>${kvRows([
    ['PDF figures re-read', q.pdf_checked!=null ? `${num(q.pdf_checked)} documents; turnover within 2% on ${pts(q.pdf_turnover_within_2pct)}%` : null, q.pdf_method],
    ['Operating profit agreement', q.pdf_op_within_2pct!=null ? `${pts(q.pdf_op_within_2pct)}% within 2%` : null, 'both misses took a neighbouring line on the right page: underlying against statutory, and operating profit before against after a joint-venture share'],
    ['Unit and period errors', q.pdf_unit_errors!=null ? `${num(q.pdf_unit_errors)} unit errors; period end agrees on ${pts(q.pdf_period_agree)}%` : null],
    ['Sector labels re-checked', q.labels_checked!=null ? `${num(q.labels_checked)} companies; ${pts(q.label_agreement_pct)}% agree` : null, q.label_method],
    ['Rubric sub-scores re-scored', q.subscores_checked!=null ? `${num(q.subscores_checked)} sub-scores; ${pts(q.subscore_within_one_pct)}% within one point, ${pts(q.subscore_exact_pct)}% exact` : null, q.subscore_method],
    ['Investment Quality gap', q.iq_gap_mean!=null ? `${pts(q.iq_gap_mean)} points on average (pipeline minus checker)` : null],
    ['Top 30 hand review', q.top30_reviewed!=null ? `${num(q.top30_reviewed)} reviewed; ${num(q.exclusions||0)} excluded with reasons in overrides.yaml` : null, q.exclusion_reasons ? Object.entries(q.exclusion_reasons).map(([k,v])=>`${k} ${v}`).join(', ') : null],
  ])}<p class="hint" style="margin-top:.5rem">Checked ${esc(date(q.computed_at))}. The checker model is ${esc(q.checker_model||'a second model')}, never used for the pipeline's own scores.</p></div>`;
}
function usefulCard(u){
  return `<div class="card"><h4>What the Ranked List Holds</h4>${kvRows([
    ['Ranked companies', num(u.ranked)],
    ['Founder or family owned', u.founder_family!=null ? `${num(u.founder_family)}${u.founder_60plus!=null?`, of which ${num(u.founder_60plus)} have an owner aged 60 or more`:''}` : null],
    ['Sponsor-owned', u.sponsor!=null ? `${num(u.sponsor)}${u.sponsor_past_hold!=null?`, of which ${num(u.sponsor_past_hold)} are four or more years into the hold`:''}` : null],
    ['Strategic Fund band', num(u.strategic_band)], ['Flagship band', num(u.flagship_band)],

function backtestBlock(b){
  const s = b.summary || {}, rows = (b.results||[]).filter(r=>r.company_number);

  return `<p class="small">${num(s.entries)} UK platform entries from 2010 to 2026 were traced to Companies House. ${num(s.point_in_time_tested)} were announced after the PSC register began in April 2016 and could be re-run on the register as it stood the month before; ${num(s.point_in_time_actionable)} sat on a route the screener acts on. Today the screener reads Cinven as the owner of ${num(s.today_reads_cinven)}. Pre-deal size comes from the research pass, partly from PDF annual reports.</p>
    <div class="tablewrap"><table><thead><tr><th>Company</th><th>Announced</th><th>Deal Type</th><th>Pre-Deal Size Band</th><th>Route Before Announcement</th><th>Cinven Owner Today</th><th>In Calibration</th></tr></thead><tbody>

    </tbody></table></div><p class="hint" style="margin-top:.5rem">Outliers are measured and kept out of the calibration; hover the label for the reason. Full detail in docs/backtests.md.</p>`;
}

function sizeStatus(i){
  const r = RANK[i[0]]; if (r) return bandLabel(r.size_fit);
  if (i[7]) return 'Size unverified';
  const e = i[6], t = i[4], emp = i[5];
  if (isNum(e)){ if (e >= T.ebitda_target_max_gbp) return 'Mega-cap'; if (e >= T.ebitda_target_min_gbp) return 'Flagship band'; if (e >= T.ebitda_early_floor_gbp) return 'Strategic fund band'; return 'Below the floor'; }
  if (isNum(t) && t >= T.rank_turnover_min_gbp) return 'Turnover only';
  if (isNum(emp) && emp >= T.universe_employees_min) return 'Head count only';
  return 'Unknown';
}
function lookup(){
  main.innerHTML = `<span class="eyebrow">Look Up</span><h1>Search Every Company in the Universe</h1>
    <p class="lead">${num(D.index.length)} UK companies: active, filing full or group accounts, at or above the size floor or size unverified, with an ownership route read from the PSC register. Search by name or company number. In-scope companies open on the Company view.</p>
    <div class="filters"><label class="f" style="flex:1;min-width:min(100%,360px)">Name or Company Number<input id="l-q" type="search" placeholder="For example: Samworth, Wernick or 00409738" autocomplete="off"></label></div>
    <div id="l-out"></div>`;
  const out = $('#l-out');
  if (!IDX_LC) IDX_LC = D.index.map(i => (i[1]||'').toLowerCase());
  let timer = null;
  const draw = () => {
    const q = $('#l-q').value.trim().toLowerCase();
    if (q.length < 2){ out.innerHTML = '<p class="hint">Type at least two characters.</p>'; return; }
    const hits = [];
    for (let k = 0; k < IDX_LC.length && hits.length < 50; k++){ if (IDX_LC[k].includes(q) || (D.index[k][0]||'').toLowerCase().includes(q)) hits.push(D.index[k]); }
    out.innerHTML = hits.length ? `<div class="tablewrap"><table><thead><tr><th>Company</th><th>Town</th><th>Route</th><th class="r">Turnover (£)</th><th class="r">Employees</th><th class="r">EBITDA (£)</th><th>Size Status</th><th>Scope</th></tr></thead><tbody>${hits.map(i=>{ const r = RANK[i[0]]; return `<tr ${r?`class="row" data-n="${esc(i[0])}"`:''}><td><strong>${esc(cname(i[1]))}</strong><span class="sub num">${esc(i[0])}</span></td><td class="small">${esc(tc(i[2]||''))}</td><td class="small">${esc(ROUTE[i[3]]||tc(i[3]||''))}</td><td class="r num">${gbp(i[4])}</td><td class="r num">${num(i[5])}</td><td class="r num">${gbp(i[6])}</td><td class="small">${esc(sizeStatus(i))}</td><td class="small">${r ? `<a href="#c-${esc(i[0])}">${r.ranked?`Ranked ${r.rank}`:'Comparable'}</a>${r.vertical?` · ${esc(SECTOR[r.vertical]||'')}`:''}` : (i[9] ? esc(i[9]) : 'In the universe; outside the six sectors or no website read')}</td></tr>`; }).join('')}</tbody></table></div>${hits.length === 50 ? '<p class="hint">Showing the first 50 matches. Add more characters to narrow the search.</p>' : ''}` : '<p class="hint">No company in the universe matches. The company may file small or abridged accounts, be dormant or dissolved, or sit below the size floor.</p>';
    $$('#l-out tr.row').forEach(tr => tr.addEventListener('click', e => { if (e.target.closest('a')) return; location.hash = 'c-'+tr.dataset.n; }));
  };
  $('#l-q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(draw, 120); });
  draw(); $('#l-q').focus();
}

route();
})();
</script>
