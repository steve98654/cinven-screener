rubric:
  # Adapted from Cinven's published Investment Approach (cinven.com/investment-approach, read 9 Nov 2026) and the
  # attributes that recur across its 2024 to 2026 deal announcements (docs/research/01, Rubric candidates): a market-leading
  # or scarce platform in a large, structurally growing market, recurring revenue and retention, resilience, organic growth
  # with margin expansion, cash generation, buy and build in a fragmented market, international expansion, management and
  # founder reinvestment, and since 2026 "well positioned to drive value from AI". Weights are ours. The pages describe the
  # firm's approach and deal rationales, not investment criteria, and the site says so.
  source_url: "https://www.cinven.com/approach/"
  source_label: "Adapted from Cinven's published Investment Approach and 2024 to 2026 deal announcements, cinven.com. Weights are ours."
  prompt_version: "rubric-cv-v1"
  min_unscored_for_grey: 2
  weights:
    1: 0.15   # Market leadership and scale
    2: 0.15   # Structural growth trends
    3: 0.15   # Resilience and revenue visibility
    4: 0.10   # Cash generation and margin quality (rule-scored from accounts)
    5: 0.15   # Growth momentum (rule-scored from accounts)
    6: 0.10   # Buy and build potential
    7: 0.05   # Internationalisation potential
    8: 0.05   # Pricing power and commercial levers
    9: 0.05   # Transformation headroom (digital, data and AI)
    10: 0.05  # Management, governance and ESG readiness
  dimension_names:
    1: "Market leadership and scale"
    2: "Structural growth trends"
    3: "Resilience and revenue visibility"
    4: "Cash generation and margin quality"
    5: "Growth momentum"
    6: "Buy and build potential"
    7: "Internationalisation potential"
    8: "Pricing power and commercial levers"
    9: "Transformation headroom"
    10: "Management, governance and ESG readiness"

# Entry fit (0 to 100), deterministic, never blended with the rubric. Bands from the measured entry profile (docs/cv_pattern.json).
fit:
  size_points: 30
  route_points: 25
  growth_points: 15
  margin_points: 10
  sector_points: 10
  data_quality_points: 10
  # size: full points inside either measured band (Strategic Fund GBP 8M to 40M EBITDA, flagship GBP 40M to 300M);
  # outside, the score falls to zero at band edge / factor below or edge * factor above. Turnover is the fallback when
  # no profit line is on file (Strategic Fund GBP 60M to 300M, flagship GBP 300M to 3B).
  ebitda_core_min_gbp: 8000000
  ebitda_core_max_gbp: 300000000
  turnover_core_min_gbp: 60000000
  turnover_core_max_gbp: 3000000000
  size_falloff_factor: 3
  # route points: Fund 8 is "eight out of ten primary or founder-led" (Cinven, Oct 2025) and SF2 targets founder-owned
  # businesses, so founder and family lead; secondaries were 78% of 2015 to 2020 core entries and still recur (UAX, Theramex,
  # Nutrisens), so sponsor-owned scores high and rises with hold years; carve-outs are a published theme (TKE, Arxada, Envu,
  # MBS); take-privates are rare (STADA 2017).
  route_scores:
    founder_family: 25
    sponsor: 22
    sponsor_offshore: 16
    plc_dispersed: 14
    foreign_parent: 14
    uk_group: 12
    employee_owned: 6
    uncertain: 0
    public_sector: 0
  sponsor_hold_full_years: 4
  sponsor_hold_min_years: 2
  growth_full: 0.10
  margin_full: 0.15
  rank_min_fit: 40

classifier:
  prompt_version: "classify-cv-v1"
  prefilter_min_hits: 1
  routes: ["founder_family", "sponsor", "sponsor_offshore", "plc_dispersed", "employee_owned"]
