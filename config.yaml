# Cinven Screener configuration. Every target criterion lives here so the bar moves without
# code changes. Dates are ISO; money is GBP unless the key says otherwise. Calibration figures
# come from docs/research (the measured entry profile) and are revised there first.

build:
  as_of_date: "2026-11-09"
  country: "GB"
  snapshot_basic: "BasicCompanyDataAsOneFile-2026-11-01.zip"
  snapshot_psc_file: "persons-with-significant-control-snapshot-2026-11-09.zip"
  snapshot_psc_date: "2026-11-09"
  snapshot_psc_parts: 33
  accounts_monthly:
    - November2025
    - December2025
    - January2026
    - February2026
    - March2026
    - April2026
    - May2026
    - June2026
    - July2026
    - August2026
    - September2026
    - October2026
  accounts_daily_from: "2026-11-01"   # day after the last monthly archive; dailies only fill the gap

paths:
  raw: data/raw
  cache: data/cache
  parquet: data/parquet
  duckdb: data/screener.duckdb
  docs: docs

target:
  status: "Active"
  # Candidates for the accounts filter: Active companies whose last accounts were filed in a
  # large-company category. Small, micro, dormant and abridged filers cannot be at Cinven's scale.
  candidate_account_categories: ["FULL", "GROUP", "MEDIUM"]
  incorporated_on_or_before: "2021-11-01"     # five years of filings
  exclude_account_categories: ["MICRO ENTITY", "DORMANT", "NO ACCOUNTS FILED", "SMALL", "TOTAL EXEMPTION SMALL", "UNAUDITED ABRIDGED", "FILLETED"]
  # SIC codes that never describe an operating business a buyout fund would buy on its own:
  # banks, insurers' regulated carriers, pension funds, trusts, public administration, SPVs.
  # Holding-company codes (64209, 70100) are kept because PE-owned groups file group accounts
  # under a Topco with exactly those codes.
  exclude_sic: ["64110", "64191", "64192", "64205", "64301", "64302", "64303", "64304", "64305", "64306", "65110", "65120", "65201", "65202", "65300", "84110", "84120", "84130", "84210", "84220", "84230", "84240", "84250", "84300", "94110", "94120", "94200", "94910", "94920", "94990", "97000", "98000", "98100", "98200", "99000", "99999"]
  sectors: ["business_services", "consumer", "financial_services", "healthcare", "industrials", "tmt"]
  force_include: ["00968046", "02015200", "06442582", "06594543", "07195122", "09766786", "09903564", "09917444", "OC301468", "OC307742"]    # back-test companies from docs/research/03, carried through the pipeline as comparables
  # Size bands, calibrated to the measured entry profile (docs/research/02a, 02b, 01 section 6). Cinven deploys two
  # vehicles side by side: the EUR 13.2B Eighth Cinven Fund (core entries 2015 to 2020 at EV EUR ~540M to 1.2B, median
  # ~800M, EBITDA ~EUR 50M to 170M; 2024 to 2026 flagship deals at EUR 1B to 3B) and the EUR 2.3B Strategic Fund 2
  # (control positions in founder-owned European mid-market businesses in Financial Services, Business Services and TMT,
  # EV ~EUR 100M to 500M). The screener shows both bands on every card; the universe floor sits below them so smaller
  # platforms stay as comparables.
  universe_turnover_min_gbp: 50000000
  universe_employees_min: 150
  universe_employees_max: 500000
  rank_turnover_min_gbp: 60000000          # at-scale gate when no profit line is on file
  ebitda_early_floor_gbp: 8000000          # at-scale gate: Strategic Fund band starts here
  ebitda_target_min_gbp: 30000000          # flagship band starts here (UK flagship entries: Kurt Geiger ~GBP 21M, JLA GBP 36M, True Potential GBP 42M, NPS GBP 74M EBITDA)
  ebitda_target_max_gbp: 300000000         # above this the deal is a mega-cap club deal (TK Elevator, STADA): outliers
  strategic_fund_sectors: ["financial_services", "business_services", "tmt"]

# Theme maps: every company in scope whose site uses a theme's vocabulary, whatever its route, so a sourcing team
# that works by sub-sector can see all the players at once. Keyword scan on the fetched site text, no model call;
# the matching sentence is shown as the evidence. Themes follow Cinven's own portfolio: insurance distribution
# (Miller, Säkra, Finaxy, Policy Expert), wealth and fund administration (True Potential, Alter Domus, Objectway),
# professional services (Grant Thornton, Flint Global), diagnostics and pharma services (SYNLAB, LGC, BioAgilytix),
# specialty distribution (Barentz), laundry and textile services (JLA), pet (Fressnapf, Arcaplanet), education (OMNES,
# UAX), fibre and hosting (Ufinet, group.One), building chemicals (Master Builders Solutions, Chryso).
themes:
  min_distinct: 3
  min_total: 5
  list:
    insurance_distribution:
      label: "Insurance distribution and MGAs"
      keywords: [insurance broker, insurance brokers, brokerage, managing general agent, MGA, underwriting agency, delegated authority, commercial insurance, personal lines, specialty insurance, claims management, loss adjust, reinsurance broker, lloyd's, lloyds of london, insurance distribution, premium finance, protection insurance, run-off, legacy insurance]
    wealth_and_advice:
      label: "Wealth management and financial advice"
      keywords: [wealth management, financial advice, financial adviser, financial advisers, financial planning, independent financial, IFA, discretionary fund management, investment platform, SIPP, pension administration, retirement planning, private clients, assets under management, assets under advice, model portfolios, financial planners]
    fund_and_corporate_services:
      label: "Fund administration and corporate services"
      keywords: [fund administration, fund administrator, corporate services, trust and company services, depositary, transfer agency, fund accounting, private capital, alternative investment funds, SPV administration, company secretarial, registered office, escrow, employee share plans, share registration]
    professional_services:
      label: "Professional services consolidation"
      keywords: [accountancy firm, accountancy practice, chartered accountants, audit and assurance, tax advisory, corporate finance advisory, law firm, solicitors, legal services, consulting firm, management consultancy, actuarial, pension consulting, insolvency, restructuring advisory, public affairs, communications consultancy]
    tic:
      label: "Testing, inspection and certification"
      keywords: [testing and inspection, inspection services, certification body, UKAS, accredited laboratory, calibration, non-destructive testing, product testing, compliance testing, type approval, conformity assessment, asset integrity, lifting equipment inspection, fire safety inspection, electrical testing]
    diagnostics_and_pharma_services:
      label: "Diagnostics, laboratories and pharma services"
      keywords: [laboratory services, laboratories, pathology, diagnostic testing, diagnostics, clinical trials, contract research, CRO, CDMO, contract manufacturing, bioanalytical, GMP, pharmaceutical manufacturing, generic medicines, specialty pharma, medical devices, life sciences, reference materials, proficiency testing]
    healthcare_services:
      label: "Healthcare services"
      keywords: [care homes, residential care, nursing homes, domiciliary care, home care, supported living, specialist care, mental health services, private hospital, hospitals, clinics, dental practices, dentistry, veterinary practices, veterinary group, fertility, ophthalmology, diagnostic imaging, healthcare staffing]
    specialty_distribution:
      label: "Specialty distribution"
      keywords: [distributor, distribution business, value-added distribution, specialty chemicals distribution, ingredients distribution, technical distribution, components distributor, electrical wholesaler, builders merchant, plumbing and heating merchant, industrial supplies, MRO, fasteners, bearings, packaging distribution, foodservice distribution, pharmaceutical wholesaler]
    education:
      label: "Education and training"
      keywords: [independent schools, independent school, schools group, international schools, university, higher education, degree programmes, students, nurseries, early years, childcare, training provider, apprenticeships, vocational training, professional qualifications, tuition, online learning, awarding organisation]
    textile_and_facilities_services:
      label: "Laundry, textile and facilities services"
      keywords: [laundry, linen, workwear rental, textile services, washroom services, hygiene services, facilities management, cleaning services, catering services, security services, pest control, waste management, grounds maintenance, mechanical and electrical maintenance, commercial laundry]
    pet:
      label: "Pet"
      keywords: [pet food, pet nutrition, pet retail, pet stores, pet products, pet care, veterinary, dog food, cat food, pet treats, pet insurance, animal health, petcare]
    consumer_health_and_nutrition:
      label: "Consumer health and nutrition"
      keywords: [vitamins, supplements, sports nutrition, protein, functional drinks, functional beverages, energy drinks, clinical nutrition, enteral nutrition, infant formula, healthy snacking, plant-based, wellness brand, over-the-counter, consumer healthcare, personal care brand]
    fibre_hosting_and_connectivity:
      label: "Fibre, hosting and connectivity"
      keywords: [fibre network, full fibre, FTTP, broadband network, wholesale connectivity, dark fibre, data centre, data centres, colocation, web hosting, domain names, managed hosting, cloud infrastructure, telecoms infrastructure, business connectivity, ISP, internet service provider, fixed wireless]
    regulated_software:
      label: "Software for regulated industries"
      keywords: [software for insurers, insurance software, policy administration, claims software, wealth management software, fund accounting software, portfolio management software, banking software, regulatory reporting, compliance software, regtech, pensions software, payroll software, tax software, practice management software, case management software, clinical software]
    building_and_specialty_chemicals:
      label: "Building products and specialty chemicals"
      keywords: [construction chemicals, admixtures, concrete admixtures, coatings, sealants, adhesives, specialty chemicals, performance chemicals, building products, insulation, roofing, cladding, mortars, grouts, waterproofing, flooring systems, resins, polymers]
    outsourced_business_services:
      label: "Outsourced business services"
      keywords: [business process outsourcing, BPO, contact centre, customer management, outsourced services, shared services, managed services, payroll services, HR services, employee benefits, background screening, document management, print management, fleet management, parking management, revenue assurance]

