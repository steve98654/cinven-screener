# Ownership routes (Stage 3, src/filter/routes.py). The buyout fund reaches a company one of four
# ways: a founder or family sells (primary), another sponsor sells (secondary), a corporate parent
# carves out a division, or a listed company is taken private. Sponsor names below extend
# ownership.investor_names with the large-cap and mid-cap owners whose exits feed Cinven's pipeline.
ownership_routes:
  walkup_levels: 7
  # Tokens from the founder screener that do not mean a buyout sponsor: trustee companies usually hold for a
  # family trust and nominee companies for an unknown beneficiary, so the walk-up looks through them.
  sponsor_tokens_ignored: ["Nominees", "Trustees"]
  # Sponsor names that are ordinary words inside other company names: matched only at the start of a name.
  sponsor_names_anchored: ["Partners Group", "Graphite", "Exponent", "Sovereign Capital", "Palatine", "Octopus", "Puma", "Foresight", "Dalmore"]
